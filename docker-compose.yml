version: '3.8'

services:
  server:
    build:
      context: .
      target: server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      # 0 = off (default); set to 30 / 60 / 90 to enable the turn timer
      - TURN_TIMER_SECONDS=${TURN_TIMER_SECONDS:-0}
      - RECONNECT_GRACE_MS=60000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DATA_DIR=/app/data
    volumes:
      - skull-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  skull-data:
